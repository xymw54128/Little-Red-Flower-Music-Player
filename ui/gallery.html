<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>小红花 · 界面设计总览</title><link rel="icon" href="assets/flower.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ebe7;color:#272b29;font-family:"Segoe UI","Microsoft YaHei",sans-serif}header{max-width:1240px;margin:0 auto;padding:48px 30px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;font-weight:600;margin:0 0 10px;display:flex;gap:12px;align-items:center}h1 img{width:32px}p{font-size:13px;line-height:1.8;color:#696f6b;margin:0}a{color:inherit;text-decoration:none}header>a{background:#ce3c4c;color:#fff;padding:13px 20px;border-radius:24px;font-size:13px;white-space:nowrap}main{max-width:1240px;margin:auto;padding:0 30px 50px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 26px}.preview{width:100%;aspect-ratio:390/844;overflow:hidden;border-radius:23px;box-shadow:0 8px 26px #25312412;border:5px solid #303330;background:#f8f8f6;position:relative}iframe{position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:top left;border:0}h2{font-size:14px;font-weight:600;margin:15px 0 6px}h2 span{font-size:11px;color:#8a9188;margin-right:8px}article p{font-size:11px}footer{padding:0 30px 40px;max-width:1240px;margin:auto;font-size:12px;line-height:1.8;color:#696f6b}@media(max-width:1000px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 18px;padding:0 18px 30px}header{padding:30px 18px;display:block}header>a{display:inline-block;margin-top:18px}h1{font-size:26px}}@media(max-width:430px){main{grid-template-columns:1fr;max-width:340px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body><header><div><h1><img src="assets/flower.svg" alt="">小红花 <span style="font-weight:400">/ 界面设计</span></h1><p>留白、清晰、自然 · 全面屏本地音乐播放器<br>统一浅色底与红花强调色，内容滚动，播放入口常驻。</p></div><a href="index.html">打开交互原型 ↗</a></header><main id="gallery"></main><footer>原创封面、歌曲与歌词仅作设计演示。真实音频播放、文件标签读取及安卓系统锁屏控件待实现；本页面模拟状态栏和手势区域，后续需在小米 15 / Android 16 实机验证。</footer>
<script>
const pages=[['library','音乐库','歌曲列表 · 搜索与导入'],['library&sheet=sort','歌曲排序','歌曲名、歌手、随机、自定义'],['library&sheet=custom-sort','自定义顺序','拖动调整 · 保存后生效'],['albums','专辑','以封面浏览本地收藏'],['artists','歌手','按歌手整理音乐'],['playlists','我的歌单','用歌单收好每一种心情'],['playlist','歌单详情','播放、添加、排序与管理'],['player','正在播放','居中封面与歌词摘要'],['lyrics','动态歌词','居中歌词 · 点击跳转'],['player&sheet=playlists','选择歌单','选择目标歌单后确认添加'],['queue','播放队列','调整播放顺序 · 移除歌曲'],['settings','设置','播放、外观与本地音乐'],['lyric-settings','歌词样式','字体、字号、行间距和动态开关'],['background','播放背景','本地相册、不透明度、大小和位置'],['theme','主题颜色','五种克制的主题色'],['import','导入音乐','单个文件或整个文件夹'],['empty','首次使用','简洁的导入引导'],['info','歌曲信息','标签、格式与歌词来源'],['folders','音乐文件夹','刷新、监测与增删改同步'],['backup','备份与恢复','单独保存歌单与设置'],['search','搜索音乐','歌曲、歌手与专辑'],['about','关于小红花','安静的本地音乐播放器']];
document.querySelector('main').innerHTML=pages.map(([route,title,sub],i)=>'<article><div class="preview"><iframe title="'+title+'界面" src="index.html?embed=1&screen='+route+'"></iframe></div><h2><span>'+String(i+1).padStart(2,'0')+'</span><a href="index.html?screen='+route+'">'+title+' ↗</a></h2><p>'+sub+'</p></article>').join('');
const observer=new ResizeObserver(entries=>entries.forEach(entry=>{entry.target.querySelector('iframe').style.transform='scale('+(entry.target.clientWidth/390)+')';}));document.querySelectorAll('.preview').forEach(el=>observer.observe(el));
</script></body></html>
